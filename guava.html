<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動折疊格子範例</title>
    <style>

        /* 2. 放置表格的展開容器 */
        .accordion-content {
            padding: 0 24px 24px 24px;
            /* 留出內距 */
        }

        /* 3. 滾動格子本體（寬度 100% 自適應） */
        .scroll-container {
            width: 100%;
            height: 250px;
            /* 固定高度，超出就會有拉桿 */
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow-y: auto;
            /* 開啟垂直捲軸 */
            background-color: #ffffff;
        }

        /* 表格樣式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        /* 固定不動的表頭 */
        .sticky-header {
            position: sticky;
            top: 0;
            background-color: #2563eb;
            /* 改為跟你網頁搭配的藍色系 */
            color: white;
            z-index: 10;
        }

        .sticky-header th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
        }

        /* 資料列樣式 */
        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        /* 斑馬線效果 */
        .data-table tr:nth-child(even) {
            background-color: #f8fafc;
        }
    </style>
</head>

<body>

    <div class="accordion-content">

        <div class="scroll-container">
            <table class="data-table">
                <thead class="sticky-header">
                    <tr>
                        <th>日期</th>
                        <th>名稱</th>
                        <th>備註</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2026-07-10</td>
                        <td>夏季學術研討會</td>
                        <td>第一會議廳</td>
                    </tr>
                    <tr>
                        <td>2026-08-15</td>
                        <td>專題演講：AI與學術研究</td>
                        <td>線上視訊</td>
                    </tr>
                    <tr>
                        <td>2026-09-20</td>
                        <td>會員大會暨聚餐</td>
                        <td>大飯店 B1</td>
                    </tr>
                    <tr>
                        <td>2026-10-05</td>
                        <td>論文投稿截止</td>
                        <td>官方網站系統</td>
                    </tr>
                    <tr>
                        <td>2026-11-12</td>
                        <td>秋季成果發表展</td>
                        <td>第二展覽館</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>

</html>

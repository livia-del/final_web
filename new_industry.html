<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業界消息</title>
    <link rel="stylesheet" href="newall.css">
    <link rel="stylesheet" href="nav.css">
</head>

<body>
    <div class="page">
        <aside class="sidebar">
            <nav class="nav">
                <a href="index.html">首頁</a>
                <a href="new_all.html" class="active">最新消息</a>
                <a href="about.html">關於學會</a>
                <a href="publish.html">研究與出版品</a>
                <a href="a.html">學術活動</a>
                <a href="contact.html">聯絡我們</a>
            </nav>
            <div class="login-box">
                <label>使用者名稱</label>
                <input type="text" placeholder="請輸入使用者名稱">
                <label>密碼</label>
                <input type="password" placeholder="請輸入密碼">
                <button>登入 / 註冊</button>
            </div>
        </aside>

        <main class="main">
            <section class="tab-buttons">
                <a href="new_all.html" class="tab">所有消息</a>
                <a href="new_IM.html" class="tab">資訊管理學會</a>
                <a href="new_school.html" class="tab">學校</a>
                <a href="new_industry.html" class="tab active">業界</a>
            </section>

            <div class="tab-content">
                <div class="filter-bar">
                    <div class="filter-item search-box">
                        <span class="filter-label">搜尋</span>
                        <div class="search-input-wrap">
                            <i data-lucide="search" class="icon-left"></i>
                            <input type="text" id="searchInput" placeholder="搜尋標題、關鍵字...">
                        </div>
                    </div>

                    <div class="filter-item date-range">
                        <span class="filter-label">搜尋日期</span>
                        <div class="date-input-group">
                            <div class="date-input-wrapper">
                                <input type="date" id="startDate" placeholder="開始日期">
                            </div>
                            <span class="date-separator">~</span>
                            <div class="date-input-wrapper">
                                <input type="date" id="endDate" placeholder="結束日期">
                            </div>
                        </div>
                    </div>

                    <div class="filter-item select-group">
                        <span class="filter-label">排序方式</span>
                        <div class="select-wrapper">
                            <select id="sortSelect">
                                <option value="latest">最新發布 (由新到舊)</option>
                                <option value="oldest">最舊發布 (由舊到新)</option>
                            </select>
                            <i data-lucide="chevron-down" class="icon-right"></i>
                        </div>
                    </div>
                    <div class="filter-item reset-group">
                        <span class="filter-label">重設</span>
                        <button class="btn-reset" id="resetBtn">
                            <i data-lucide="refresh-cw"></i>清除篩選
                        </button>
                    </div>
                </div>

                <div class="list-wrapper" id="newsListContainer">
                </div>

                <div id="cardTemplate" style="display: none;">
                    <a href="#" class="card">
                        <div class="card-main">
                            <div class="category-block">
                                <div class="badge-icon"><i data-lucide="users"></i></div>
                                <span class="category-text">分類</span>
                            </div>
                            <div class="content-block">
                                <h3 class="card-title">標題</h3>
                                <p class="card-summary">摘要</p>
                            </div>
                        </div>
                        <div class="card-side">
                            <span class="date-info"><i data-lucide="calendar"></i><span
                                    class="date-text">2026-01-01</span></span>
                            <span class="more-link"><span>閱讀更多</span><i data-lucide="arrow-right"></i></span>
                        </div>
                    </a>
                </div>

                <div class="pagination" id="paginationContainer"></div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="main.js"></script>
</body>

</html>

<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>活動花絮</title>

    <link rel="stylesheet" href="activity.css" />

</head>

<body>


    <main class="main">
        <section class="content-grid">
            <section class="event-carousel">
                <div class="activity-title">
                    <span></span>
                    <div>
                        <h2>活動花絮</h2>
                        <p>記錄每一場活動的精彩時刻</p>
                    </div>
                    <span></span>
                </div>
                <div class="carousel-wrap">
                    <div class="carousel">
                        <a class="activity-card side" href="#">
                            <img src="https://images.unsplash.com/photo-1523580494863-6f3031224c94?auto=format&fit=crop&w=900&q=80" alt="活動照片">
                            <div class="event-info">
                                <div>
                                    <span class="tag red">論壇</span>
                                    <span class="activity-date">2026-03-24</span>
                                </div>
                                <h3>第30屆大專校院資訊應用服務創新競賽</h3>
                                <span class="detail-link">查看詳情 →</span>
                            </div>
                        </a>
                        <a class="activity-card main-card" href="#">

                            <img src="https://images.unsplash.com/photo-1515187029135-18ee286d815b?auto=format&fit=crop&w=1200&q=80" alt="活動照片">
                            <div class="event-info">
                                <div>
                                    <span class="tag blue">研討會</span>
                                    <span class="activity-date">2026-05-09</span>
                                </div>
                                <h3>ICIM 2026 第37屆國際資訊管理學術研討會</h3>
                                <span class="detail-link">查看詳情 →</span>
                            </div>
                        </a>
                        <a class="activity-card side" href="#">
                            <img src="https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&w=900&q=80" alt="活動照片">
                            <div class="event-info">
                                <div>
                                    <span class="tag yellow">工作坊</span>
                                    <span class="activity-date">2026-03-24</span>
                                </div>
                                <h3>資料科學與 AI 應用工作坊</h3>
                                <span class="detail-link">查看詳情 →</span>
                            </div>
                        </a>
                    </div>
                </div>
                <button class="more-btn">瀏覽更多活動花絮 →</button>
            </section>
        </section>
    </main>
</body>

</html>

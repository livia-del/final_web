<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>活動花絮</title>

    <link rel="stylesheet" href="activity.css" />

</head>

<body>

    <aside class="sidebar">

        <nav class="side-nav">

            <a class="active" href="#">首頁</a>

            <a href="#">最新消息</a>

            <a href="#">關於學會</a>

            <a href="#">研究與出版品</a>

            <a href="#">學術活動</a>

            <a href="#">聯絡我們</a>

        </nav>

        <div class="login-box">

            <label>使用者名稱</label>

            <input type="text" placeholder="請輸入使用者名稱" />

            <label>密碼</label>

            <input type="password" placeholder="請輸入密碼" />

            <button>登入 / 註冊</button>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="brand">

                <div class="logo">CSIM</div>

                <div>

                    <h1>中華民國資訊管理學會</h1>

                    <p>Chinese Society for Information Management</p>

                </div>

            </div>

            <nav class="top-nav">

                <a href="#">首頁</a>

                <a href="#">關於學會</a>

                <a href="#">各校資管系所</a>

                <a href="#">研究及出版品</a>

                <a class="active" href="#">活動花絮</a>

                <a href="#">聯絡我們</a>

                <a href="#">English</a>

            </nav>

        </header>

        <section class="content-grid">


            <section class="event-carousel">

                <div class="section-title">

                    <span></span>

                    <div>

                        <h2>活動花絮</h2>

                        <p>記錄每一場活動的精彩時刻</p>

                    </div>

                    <span></span>

                </div>

                <div class="carousel-wrap">

                    <button class="arrow left">‹</button>

                    <div class="carousel">

                        <article class="event-card side">

                            <img src="https://images.unsplash.com/photo-1523580494863-6f3031224c94?auto=format&fit=crop&w=900&q=80"
                                alt="活動照片">

                            <div class="event-info">

                                <div>

                                    <span class="tag red">論壇</span>

                                    <span class="date">2026-03-24</span>

                                </div>

                                <h3>第30屆大專校院資訊應用服務創新競賽</h3>

                                <a href="#">查看詳情 →</a>

                            </div>

                        </article>

                        <article class="event-card main-card">

                            <img src="https://images.unsplash.com/photo-1515187029135-18ee286d815b?auto=format&fit=crop&w=1200&q=80"
                                alt="活動照片">

                            <div class="event-info">

                                <div>

                                    <span class="tag blue">研討會</span>

                                    <span class="date">2026-05-09</span>

                                </div>

                                <h3>ICIM 2026 第37屆國際資訊管理學術研討會</h3>

                                <a href="#">查看詳情 →</a>

                            </div>

                        </article>

                        <article class="event-card side">

                            <img src="https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&w=900&q=80"
                                alt="活動照片">

                            <div class="event-info">

                                <div>

                                    <span class="tag yellow">工作坊</span>

                                    <span class="date">2026-03-24</span>

                                </div>

                                <h3>資料科學與 AI 應用工作坊</h3>

                                <a href="#">查看詳情 →</a>

                            </div>

                        </article>

                    </div>

                    <button class="arrow right">›</button>

                </div>

                <div class="dots">

                    <span class="active"></span>

                    <span></span>

                    <span></span>

                    <span></span>

                </div>

                <button class="more-btn">瀏覽更多活動花絮 →</button>
        </section>
    </main>
</body>

</html>

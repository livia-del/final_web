<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="nav.css">
</head>
<body>
    <div class="page">
        <aside class="sidebar">
            <nav class="nav">
                <a href="index.html">首頁</a>
                <a href="new_all.html">最新消息</a>
                <a href="about.html">關於學會</a>
                <a href="publish.html" class="active">研究與出版品</a>
                <a href="a.html">學術活動</a>
                <a href="contact.html">聯絡我們</a>
            </nav>
            <div class="login-box">
                <label>使用者名稱</label>
                <input type="text" placeholder="請輸入使用者名稱">
                <label>密碼</label>
                <input type="password" placeholder="請輸入密碼">
                <button>登入 / 註冊</button>
            </div>
        </aside>

        <!-- 右側內容 -->
        <main class="main">

<div class="main-content">

    <div class="tabs-container">
        <button type="button" class="tab-btn active" id="tab-2008" onclick="switchConference('2008')">
            第十九屆國際資訊管理學術研討會(2008)
        </button>
        <button type="button" class="tab-btn" id="tab-2004" onclick="switchConference('2004')">
            第十五屆國際資訊管理學術研討會(2004)
        </button>
    </div>

    <div class="content-panel">
        
        <h3 class="section-subtitle" id="dynamic-title">
            相關論文
        </h3>

        <table class="data-table">
            <thead>
                <tr>
                    <th style="width: 40%;">論文名稱</th>
                    <th style="width: 15%;">應用領域</th>
                    <th style="width: 25%;">關鍵字</th>
                    <th style="width: 12%;">作者</th>
                    <th style="width: 8%;">論文下載</th>
                </tr>
            </thead>
            <tbody id="paper-list-body">
                </tbody>
        </table>
        
    </div>
</div>

<script>
    // 包含 2008 與 2004 完整真實論文資料庫
    const paperDatabase = {
        "2008": {
            fullName: "第十九屆國際資訊管理學術研討會",
            papers: [
                { 
                    title: "併購企業資訊系統整合自製與委外決策模式研究", 
                    area: "資訊管理", 
                    keywords: "併購企業, 資訊整合, 自製與委外決策模式", 
                    author: "盧春芳, 黃世禎, 傅上珍", 
                    file: "20080002.pdf" 
                },
                { 
                    title: "知識鏈之探討: 以顧客、供應商與競爭者", 
                    area: "資訊管理", 
                    keywords: "知識鏈, 顧客知識, 供應商知識, 競爭者知識", 
                    author: "曾淑美, 吳俊儀", 
                    file: "20080001.pdf" 
                }
            ]
        },
        "2004": {
            fullName: "第十五屆國際資訊管理學術研討會",
            papers: [
                { 
                    title: "Web Service與定位技術的整合及應用", 
                    area: "通訊網路技術", 
                    keywords: "Context Awareness, Web Service, 位置資訊", 
                    author: "卓忠志, 潘志勝, 古東明", 
                    file: "20040011.pdf" 
                },
                { 
                    title: "無線區域網路之位置導向服務品質監測", 
                    area: "通訊網路技術", 
                    keywords: "無線區域網路, 服務品質, 效能管理, SNMP", 
                    author: "陳彥錚, 陳秋彰", 
                    file: "20040010.pdf" 
                },
                { 
                    title: "非集中式點對點環境下之快速與低頻寬需求之服務搜尋方法設計", 
                    area: "通訊網路技術", 
                    keywords: "點對點, 網域名稱伺服器, 非集中式點對點網路, 服務搜尋", 
                    author: "陳青文, 楊朝翔, 顏佩詩", 
                    file: "20040009.pdf" 
                },
                { 
                    title: "在多重通道隨意網路上利用控制與資料通道頻寬比例使效能最大化之策略", 
                    area: "通訊網路技術", 
                    keywords: "無線隨意網路, 媒體存取層, 效能, 資料通道, 控制通道", 
                    author: "陳青文, 方清宏, 賴俊良, 洪瑞聰", 
                    file: "20040008.pdf" 
                },
                { 
                    title: "Misuse Detection of New Malicious Emails", 
                    area: "通訊網路技術", 
                    keywords: "email virus detection, self-organizing maps, network security", 
                    author: "Dong-Her Shih, Chun-Pin Chang, Hsiu-Sen Chiang", 
                    file: "20040007.pdf" 
                },
                { 
                    title: "協同過濾技術在商品推薦系統上之應用與成效評估", 
                    area: "通訊網路技術", 
                    keywords: "電子商務, 消費者行為, 協同過濾, 推薦系統", 
                    author: "吳肇銘, 金志聿, 林怡秀", 
                    file: "20040006.pdf" 
                },
                { 
                    title: "結合IC卡之校園安全網頁系統之設計與實現", 
                    area: "通訊網路技術", 
                    keywords: "IC卡, WWW, AES, RSA, PHP", 
                    author: "陳軒正, 楊中皇", 
                    file: "20040005.pdf" 
                },
                { 
                    title: "以電力能源為基礎的蜂巢式階層管理", 
                    area: "通訊網路技術", 
                    keywords: "隨意式無線網路, 無基礎建設的網路結構, 蜂巢式階層管理架構, 行動代理人, 行動設備", 
                    author: "王淑卿, 嚴國慶, 周雨韻", 
                    file: "20040004.pdf" 
                },
                { 
                    title: "行動商務應用之動態使用者查詢系統", 
                    area: "通訊網路技術", 
                    keywords: "定址化服務, 動態查詢, 查詢系統, 行動服務", 
                    author: "翁頌舜, 周尹禎", 
                    file: "20040003.pdf" 
                },
                { 
                    title: "行動網路環境下付款機制之研究", 
                    area: "通訊網路技術", 
                    keywords: "預付服務, 行動付款, 無線智慧網路", 
                    author: "羅濟群, 黃俊龍", 
                    file: "20040001.pdf" 
                }
            ]
        }
    };

    // 點擊標籤切換年份資料
    function switchConference(year) {
        // 1. 切換標籤 active 狀態
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const targetTab = document.getElementById(`tab-${year}`);
        if (targetTab) targetTab.classList.add('active');

        // 2. 獲取對應年份資料
        const targetData = paperDatabase[year];
        if (!targetData) return;

        // 3. 更新動態標題
        document.getElementById('dynamic-title').innerText = `相關論文 (當前選擇：${targetData.fullName})`;

        // 4. 清空舊列表並重新建構表格內容
        const tbody = document.getElementById('paper-list-body');
        tbody.innerHTML = '';

        targetData.papers.forEach(paper => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="clickable-link" onclick="alert('開啟論文詳細資訊：${paper.title}')">${paper.title}</span></td>
                <td>${paper.area}</td>
                <td><small style="color:#64748b">${paper.keywords}</small></td>
                <td>${paper.author}</td>
                <td>
                    <a href="#" class="btn-download" onclick="alert('開始下載論文檔案: ${paper.file}')">
                        <span class="pdf-icon">📄</span>${paper.file}
                    </a>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 網頁初始載入預設顯示 2008 年
    window.onload = function() {
        switchConference('2008');
    };
</script>
        </main>

    </div>

</body>

</body>

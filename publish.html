                    abstract: "由於無線區域網路的快速成長及普及,使得無線區域網路的管理變得日益重要。在本篇論文中,我們設計並實現了一個適用於校園環境的無線區域網路管理系統。本系統採用網頁介面,使得管理人員能夠在任何時間、任何地點透過網路瀏覽器對無線區域網路的基地台(AP)進行遠端監控及設定。系統功能包括使用者認證、流量監測、AP狀態查詢以及安全警示等等。透過此系統的建立,不但能有效提高無線區域網路的管理效率,更可保障校園網路的整體安全。"
                }
            ]
        }
    };

    // 1. 切換分頁年份
    function switchConference(year) {
        // 【修正】將 .tab-btn 改為 .tab，對應 HTML 的 class
        document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
        
        const targetTab = document.getElementById(`tab-${year}`);
        if (targetTab) targetTab.classList.add('active');

        const targetData = paperDatabase[year];
        if (!targetData) return;

        // 【新增】動態更新大標題
        document.getElementById('dynamic-title').innerText = targetData.fullName;

        const tbody = document.getElementById('paper-list-body');
        tbody.innerHTML = '';

        targetData.papers.forEach(paper => {
            // 主要論文列
            const mainTr = document.createElement('tr');
            mainTr.className = 'main-row';
            mainTr.innerHTML = `
                <td>
                    <span class="clickable-title" style="cursor:pointer;" onclick="toggleAccordion('${paper.id}')">
                         ${paper.title}
                    </span>
                </td>
                <td>
                    <a href="#" class="btn-download" onclick="alert('開始下載: ${paper.file}'); return false;">
                        📄 ${paper.file}
                    </a>
                </td>
            `;

            // 手風琴詳細內文面板
            const detailTr = document.createElement('tr');
            detailTr.id = `detail-${paper.id}`;
            detailTr.className = 'detail-row';
            // 預設先用 CSS 控制隱藏，或是此處保持原邏輯
            detailTr.innerHTML = `
                <td colspan="2">
                    <div class="detail-box" style="padding: 10px; background-f9f9f9;">
                        <div class="detail-item">
                            <span class="detail-label"><strong>應用領域：</strong></span>
                            <span class="detail-value">${paper.area}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label"><strong>關鍵字：</strong></span>
                            <span class="detail-value">${paper.keywords}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label"><strong>作者：</strong></span>
                            <span class="detail-value">${paper.author}</span>
                        </div>
                        <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
                        <div class="abstract-box">
                            <strong>摘要：</strong><br>
                            <p style="text-align:justify; text-indent: 2em; margin-top:5px;">${paper.abstract}</p>
                        </div>
                    </div>
                </td>
            `;

            tbody.appendChild(mainTr);
            tbody.appendChild(detailTr);
        });
    }

    // 2. 展開與收合控制
    function toggleAccordion(id) {
        const targetRow = document.getElementById(`detail-${id}`);
        const isCurrentlyOpen = targetRow.classList.contains('open');

        // 先收合網頁上其他打開的面板
        document.querySelectorAll('.detail-row').forEach(row => {
            row.classList.remove('open');
            row.style.display = 'none'; // 如果 CSS 沒寫，可用 JS 強制輔助隱藏
        });

        // 再次點擊規則切換
        if (!isCurrentlyOpen) {
            targetRow.classList.add('open');
            targetRow.style.display = 'table-row'; // 顯示 TR 元素
        } else {
            targetRow.classList.remove('open');
            targetRow.style.display = 'none';
        }
    }

    // 預設載入 2004 年資料展示
    window.onload = function() {
        switchConference('2004');
    };
</script>

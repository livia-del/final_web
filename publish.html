<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究與出版品</title>
    <link rel="stylesheet" href="publish.css">
    <link rel="stylesheet" href="nav.css">
</head>
<body>
    <div class="page">
        <aside class="sidebar">
            <nav class="nav">
                <a href="index.html">首頁</a>
                <a href="new_all.html">最新消息</a>
                <a href="about.html">關於學會</a>
                <a href="publish.html" class="active">研究與出版品</a>
                <a href="a.html">學術活動</a>
                <a href="contact.html">聯絡我們</a>
            </nav>
            <div class="login-box">
                <label>使用者名稱</label>
                <input type="text" placeholder="請輸入使用者名稱">
                <label>密碼</label>
                <input type="password" placeholder="請輸入密碼">
                <button>登入 / 註冊</button>
            </div>
        </aside>

        <!-- 右側內容 -->
        <main class="main">

<div class="main-content">

    <div class="tabs-container">
        <button type="button" class="tab-btn active" onclick="switchTab(event, 'tab-conference')">研討會論文集</button>
        <button type="button" class="tab-btn" onclick="switchTab(event, 'tab-search')">論文查詢</button>
    </div>

    <div class="content-panel">
        
        <div id="tab-conference" class="tab-content active">
            <h3 class="page-title">研討會列表</h3>
            
            <div class="filter-section">
                <div class="filter-group">
                    <label class="filter-label">主辦單位</label>
                    <input type="text" class="input-search" id="search-org" placeholder="請輸入主辦單位">
                </div>
                <div class="filter-group">
                    <label class="filter-label">排序資料</label>
                    <select class="select-box" id="sort-type">
                        <option value="year">年份</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">排序</label>
                    <select class="select-box" id="sort-dir">
                        <option value="desc">遞減</option>
                        <option value="asc">遞增</option>
                    </select>
                </div>
                <button type="button" class="btn-apply" onclick="sortConference()">套用排序</button>
            </div>

            <table class="data-table" id="conference-table">
                <thead>
                    <tr>
                        <th style="width: 45%;">研討會名稱</th>
                        <th style="width: 35%;">主辦單位</th>
                        <th style="width: 10%;">年份</th>
                        <th style="width: 10%;">論文集</th>
                    </tr>
                </thead>
                <tbody>
                    <tr data-year="2008">
                        <td><span class="clickable-link" onclick="loadPapers('2008 第十九屆國際資訊管理學術研討會')">第十九屆國際資訊管理學術研討會</span></td>
                        <td>中華民國資訊管理學會，暨南國際大學資管系</td>
                        <td>2008</td>
                        <td><span class="clickable-link" onclick="loadPapers('2008 第十九屆國際資訊管理學術研討會')">檢視</span></td>
                    </tr>
                    <tr data-year="2004">
                        <td><span class="clickable-link" onclick="loadPapers('2004 第十五屆國際資訊管理學術研討會')">第十五屆國際資訊管理學術研討會</span></td>
                        <td>中華民國資訊管理學會</td>
                        <td>2004</td>
                        <td><span class="clickable-link" onclick="loadPapers('2004 第十五屆國際資訊管理學術研討會')">檢視</span></td>
                    </tr>
                </tbody>
            </table>

            <div id="sub-paper-area" class="sub-paper-section" style="display: none;">
                <h3 class="page-title" id="current-conf-title">相關論文列表</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 40%;">論文名稱</th>
                            <th style="width: 15%;">應用領域</th>
                            <th style="width: 25%;">關鍵字</th>
                            <th style="width: 10%;">作者</th>
                            <th style="width: 10%;">論文下載</th>
                        </tr>
                    </thead>
                    <tbody id="paper-list-body">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="tab-search" class="tab-content">
            <h3 class="page-title">進階論文查詢</h3>
            <p style="color: #666; font-size: 14px;">此功能介面維護中，可在這裡加入關鍵字、作者、年份等進階欄位檢索功能。</p>
        </div>

    </div>
</div>

<script>
    // 模擬圖三的論文資料庫
    const mockPaperData = {
        "2008 第十九屆國際資訊管理學術研討會": [
            { title: "Web Service與定位技術的整合及應用", area: "通訊網路", keywords: "Context Awareness, Web Service, 位置資訊", author: "卓忠志, 潘志勝", file: "20080011.pdf" },
            { title: "無線區域網路之位置導向服務品質監測", area: "通訊網路/路技術", keywords: "無線區域網路, 服務品質, 效能管理, SNMP", author: "陳彥錚, 陳秋彰", file: "20080010.pdf" },
            { title: "非集中式點對點環境下之快速與低頻寬需求之服務搜尋方法設計", area: "通訊網路/路技術", keywords: "點對點, 網域名稱伺服器, 服務搜尋", author: "陳青文, 楊朝翔", file: "20080009.pdf" }
        ],
        "2004 第十五屆國際資訊管理學術研討會": [
            { title: "結合IC卡之校園安全網頁系統之設計與實現", area: "通訊網路/路技術", keywords: "IC卡, WWW, AES, RSA, PHP", author: "陳軒正, 楊中皇", file: "20040005.pdf" },
            { title: "行動商務應用之動態使用者查詢系統", area: "通訊網路/路技術", keywords: "定位化服務, 動態查詢, 行動服務", author: "翁頌舜, 周尹禎", file: "20040003.pdf" }
        ]
    };

    // 上方大分頁標籤切換
    function switchTab(event, tabId) {
        // 切換按鈕 active 樣式
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');

        // 切換內容區顯示
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
    }

    // 點擊「檢視」動態載入下方論文清單
    function loadPapers(confTitle) {
        const subArea = document.getElementById('sub-paper-area');
        const titleSpan = document.getElementById('current-conf-title');
        const tbody = document.getElementById('paper-list-body');
        
        titleSpan.innerText = `📁 ${confTitle} - 相關論文`;
        tbody.innerHTML = ''; 
        
        const papers = mockPaperData[confTitle] || [];
        
        papers.forEach(paper => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="clickable-link" onclick="alert('點擊論文查看詳情')">${paper.title}</span></td>
                <td>${paper.area}</td>
                <td><small style="color:#667085">${paper.keywords}</small></td>
                <td>${paper.author}</td>
                <td><a href="#" class="btn-download" onclick="alert('開始下載: ${paper.file}')">📄 PDF</a></td>
            `;
            tbody.appendChild(tr);
        });
        
        subArea.style.display = 'block';
        subArea.scrollIntoView({ behavior: 'smooth' });
    }

    // 研討會列表遞增/遞減排序功能
    function sortConference() {
        const tableBody = document.querySelector('#conference-table tbody');
        const rows = Array.from(tableBody.querySelectorAll('tr'));
        const direction = document.getElementById('sort-dir').value;

        rows.sort((rowA, rowB) => {
            const yearA = parseInt(rowA.getAttribute('data-year'), 10);
            const yearB = parseInt(rowB.getAttribute('data-year'), 10);
            return direction === 'asc' ? yearA - yearB : yearB - yearA;
        });

        tableBody.innerHTML = '';
        rows.forEach(row => tableBody.appendChild(row));
    }
</script>



        </main>

    </div>

</body>

</html>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中華民國資訊管理學會 CSIM</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="nav.css">
</head>

<body>
    <div class="page">
        <aside class="sidebar">
            <nav class="nav">
                <a href="index.html">首頁</a>
                <a href="#">最新消息</a>
                <a href="#">關於學會</a>
                <a href="#">研究與出版品</a>
                <a href="#">學術活動</a>
                <a href="#" class="active">聯絡我們</a>
            </nav>
            <div class="login-box">
                <label>使用者名稱</label>
                <input type="text" placeholder="請輸入使用者名稱">
                <label>密碼</label>
                <input type="password" placeholder="請輸入密碼">
                <button>登入 / 註冊</button>
            </div>
        </aside>

        <main class="main">
            <div class="about-container">

                <div class="contact-container">

                    <h1 class="contact-title">聯絡我們</h1>

                    
                    <p class="contact-description" style="text-align: center; color: #EB544A;" >請優先利用 email 聯絡，會盡量即時回覆。</p>

                    <p class="contact-description" style="text-align: center;">
                        中華民國資訊管理學會成立於民國 79年，係集合群國大專院校資訊管理學門之學者專家與部分資訊業界之精英組合而成。</p>
                    <p class="contact-description" style="text-align: center;">如果您對改進本網站的各項功能有任何建議，歡迎您隨時將改進意見反映給我們，我們的聯絡資料如下：</p>
                    <br> </br>
                    

                </div>

                <section class="about-research">
                    <div class="research-grid">

                        <a class="research-card" href="https://maps.google.com/?q=251301新北市淡水區英專路151號" target="_blank" style="color: inherit; text-decoration: none; cursor: pointer; display: block;">
                            <h3>地 址</h3>
                            <p>
                                251301 新北市淡水區英專路151號 (資管系) 🔗
                            </p>
                        </a>

                        <div class="research-card" onclick="copyEmail(this)" style="cursor: pointer;" title="點擊自動複製 Email">
                            <h3>官方電子信箱</h3>
                            <p>csim.service@gmail.com</p>
                        </div>

                        <div class="research-card" onclick="copyEmail(this)" style="cursor: pointer;" title="點擊自動複製 Email">
                            <h3>理事長信箱</h3>
                            <p>rsshaw@mail.tku.edu.tw</p>
                        </div>

                        <div class="research-card" onclick="copyEmail(this)" style="cursor: pointer;" title="點擊自動複製 Email">
                            <h3>秘書長信箱</h3>
                            <p>james@mail.tku.edu.tw</p>
                        </div>

                    </div>
                </section>

            </div>

            <button id="backToTop" class="back-to-top" onclick="scrollToTop()">
                回到頂部
            </button>
        </main>
    </div>

    <script src="main.js"></script>

    <script>
        function copyEmail(cardElement) {
            // 抓取卡片內 <p> 標籤底下的 Email 文字
            const emailText = cardElement.querySelector('p').innerText.trim();
            
            // 複製到剪貼簿
            navigator.clipboard.writeText(emailText).then(() => {
                alert("已成功複製信箱: " + emailText);
            }).catch(err => {
                console.error("複製失敗: ", err);
            });
        }
    </script>
</body>

</html>
